<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>Formulir Pendaftaran</h1>

        <form action="#" method="post">
            <div class="form-group">
                <label>Nama Lengkap:</label>
                <br>
                <input type="text" name="uname_input" id="uname_id" placeholder="Input Nama"> 
            </div>

            <br>

            <div class="form-group">
                <label>Email:</label>
                <br>
                <input type="text" name="uname_input" id="uname_id" placeholder="Input Email"> 
            </div>

            <br>

            <div class="form-group">
                <label>Nomor Telepon:</label>
                <br>
                <input type="tel" name="uname_input" id="uname_id" placeholder="Input Nomor"> 
            </div>

            <br>

            <div class="form-group">
                <label>Institusi/Asal Sekolah:</label>
                <br>
                <input type="tel" name="uname_input" id="uname_id" placeholder="Input Institusi"> 
            </div>

            <br>

            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <br>
                <input type="radio" name="jk_input" id="pria" value="Pria">
                <label for="pria">Laki-Laki</label>
                <input type="radio" name="jk_input" id="pria" value="Wanita">
                <label for="pria">Perempuan</label>
            </div>

            <br>

            <div class="form-group"> 
                <label for="uname_id">Tanggal Lahir: </label>
                <br>
                <input type="date"> 
            </div>
            
            <br>

            <div class="form-group">
                <label>Kategori Peserta</label>
                <br>
                <input type="radio" name="jk_input" id="pelajar" value="Pelajar">
                <label for="pria">Pelajar</label>
                <input type="radio" name="jk_input" id="mahasiswa" value="Mahasiswa">
                <label for="pria">Mahasiswa</label>
                <input type="radio" name="jk_input" id="umum" value="Umum">
                <label for="pria">Umum</label>
            </div>

            <br>

           
            <legend>Pilih kegiatan</legend> 
            <div> 
                <input type="checkbox" name="WE_input" id="workshop" value="workshop"> 
                <label for="WE">Workshop Eksperimen Fisika</label> 
            </div> 
            
            <div> 
                <input type="checkbox" name="WD_input" id="workshop" value="workshop> 
                <label for="WD">Workshop Dasar Data Science</label> 
            </div> 
            
            <div> 
                <input type="checkbox" name="ST_input" id="seminar" value="seminar">
                <label for="ST">Seminar Teknologi dan Masa Depan</label> 
            </div>

            <div> 
                <input type="checkbox" name="WR_input" id="workshop" value="workshop> 
                <label for="WR">Workshop Robotika Dasar</label> 
            </div>

            <div> 
                <input type="checkbox" name="KS_input" id="Kompetisi" value="Kompetisi"> 
                <label for="KS">Kompetisi Science Project</label> 
            </div>

            <div> 
                <input type="checkbox" name="KD_input" id="kompetisi" value="Kompetisi"> 
                <label for="KD">Kompetisi Data Challange</label> 
            </div>

            <div> 
                <input type="checkbox" name="SK_input" id="Seminar" value="Seminar"> 
                <label for="SI">Seminar Inovasi Energi</label> 
            </div>

            <div> 
                <input type="checkbox" name="SK_input" id="seminar" value="Seminar"> 
                <label for="SK">Seminar Kecerdasan buatan</label> 
            </div>

            <div> 
                <input type="checkbox" name="KR_input" id="Kompetisi" value="Kompetisi"> 
                <label for="KR">Kompetisi Robotika Nusantara</label> 
            </div>

            <br>

            <div class="form-group"> 
                <label for="uname_id">Kebutuhan Khusus/Informasi Tambahan: </label>
                <br>
                <textarea rows="5" cols="40" placeholder="Ketik di Sini"></textarea>
            </div>

            <br>

            <div class="form-actions">  
                <button type="button">Daftar Sekarang</button> 
            </div> 
        </form>

        <br>

        <a href="index.html">Beranda, </a>
        <a href="Jadwal.html">Jadwal</a>
    </body>

</html>
